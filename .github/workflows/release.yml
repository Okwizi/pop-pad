name: Release

# Pushing a tag such as v0.1.0 on master builds, checks and publishes the zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: The tag must be on master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::release tags must point at a commit on master"; exit 1; }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++ g++-mingw-w64-i686
      - run: sudo sysctl vm.mmap_rnd_bits=28 || true
      - name: Format, lint, build and test
        run: tools/check.sh
      - name: Build the icon atlases and package
        run: |
          python tools/build_glyphs.py
          tools/package.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "dist/pop-pad-$GITHUB_REF_NAME.zip" --title "pop-pad $GITHUB_REF_NAME" --generate-notes --verify-tag "${flags[@]}"
