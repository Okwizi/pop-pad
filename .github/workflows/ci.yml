name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: clang-format
        run: clang-format --dry-run -Werror src/*.cpp src/*.h tests/native/*.cpp tests/native/shim/*.h
      - name: ruff
        run: |
          ruff check tools tests
          ruff format --check tools tests
      - name: shellcheck
        run: shellcheck -x tools/*.sh tools/dev/*.sh

  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++
      # AddressSanitizer needs a smaller address-space randomisation than newer kernels default to.
      - run: sudo sysctl vm.mmap_rnd_bits=28 || true
      - name: C++ unit tests
        run: |
          cmake -S tests/native -B build/native -G Ninja -DPOPPAD_WERROR=ON
          cmake --build build/native
          ctest --test-dir build/native --output-on-failure
      - name: Python unit tests
        run: python -m pytest -q

  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cmake ninja-build g++-mingw-w64-i686
      - name: Build the DLL (warnings are errors)
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Release -DPOPPAD_WERROR=ON
          cmake --build build
      - name: Build the icon atlases
        run: python tools/build_glyphs.py
      - name: Package
        run: tools/package.sh "ci-${GITHUB_SHA::7}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pop-pad-${{ github.sha }}
          path: dist/pop-pad-*.zip
          retention-days: 14
