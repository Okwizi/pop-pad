; pop-pad settings. Lives next to dinput8.dll in the game folder; every line is optional.

[General]
; Write poppad.log in the game folder. Useful when reporting a problem.
Log=1

[Input]
; Send Xbox-type (XInput) controllers, including Steam Input's virtual pad, to the game's own
; Xbox controller code. 0 restores the game's stock behaviour.
NativeXInput=1

; Profiles created without a controller have no gamepad bindings at all. 1 adds the game's own
; default Xbox layout to such profiles; the original is kept as Profile.DAT.before-pop-pad.
AddDefaultBindings=1

; Stick travel, in percent, that counts as fully pushed. The game reads each axis separately, so
; a round stick never reaches full speed on a diagonal at 100. Range 30-100.
StickSaturation=75

[Glyphs]
; Show button icons instead of text labels for pad inputs. 0 keeps the game's text.
; Needs the poppad\glyphs folder next to this file.
Enabled=1

; auto picks from the connected controller, found through Windows' device list so that it also
; works under Steam Input; or force xbox, playstation, switch or generic (Xbox letter positions
; without Xbox colours, for 8BitDo and similar pads).
Style=auto
